      identifier: DaanDeMeyer/reproc
      use_max_tag: true
      include_regex: ^v\d+\.\d+\.\d+$
      from_pattern: ^v(.+)$
      to_pattern: \1
    packages:
      - reproc
      - reproc-cpp
      - reproc-cpp-static
      - reproc-static
